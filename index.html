<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JagoIndia – Awareness, Technology & Modern India</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="JagoIndia is a modern platform sharing deep insights on awareness, technology, youth, and the future of India. Read thoughtful blogs shaping tomorrow."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jagoindia.online/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/vite.svg" />

    <!-- Open Graph (THIS CREATES PNG PREVIEW) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JagoIndia – Awakening Modern India" />
    <meta
      property="og:description"
      content="Awareness, technology, and real stories shaping India in 2026."
    />
    <meta property="og:url" content="https://jagoindia.online" />
    <meta property="og:image" content="https://jagoindia.online/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JagoIndia – Awakening Modern India" />
    <meta
      name="twitter:description"
      content="Read powerful blogs on awareness, youth, and technology shaping India."
    />
    <meta name="twitter:image" content="https://jagoindia.online/preview.png" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Dark Mode -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {},
        },
      };
    </script>

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body class="bg-white dark:bg-black text-black dark:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
